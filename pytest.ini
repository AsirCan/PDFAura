[pytest]
testpaths = tests
# A local run skips the real window (e2e) and the real LibreOffice
# conversion (slow, ~15 s); CI runs both:
#   python -m pytest -m e2e        python -m pytest -m slow
addopts = -ra -m "not e2e and not slow"
markers =
    e2e: drives the real WebView2 window over CDP (python main.py); needs web/dist
    slow: starts a real external program (LibreOffice); runs in CI
